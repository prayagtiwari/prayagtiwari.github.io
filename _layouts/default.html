---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="site-shell page-{% if page.url == '/' %}home{% else %}{{ page.url | slugify }}{% endif %}">

    <a class="skip-link" href="#main">Skip to main content</a>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}
    <script src="{{ base_path }}/assets/js/site-navigation.js" defer></script>

  </body>
</html>
