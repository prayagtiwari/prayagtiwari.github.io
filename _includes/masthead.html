{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-brand" href="{{ base_path }}/" aria-label="{{ site.title }} home">
      <img src="{{ base_path }}/images/favicon.svg" width="40" height="40" alt="">
      <span>{{ site.title }}<small>Machine Learning</small></span>
    </a>
    <nav class="site-navigation" aria-label="Main navigation">
        <button class="site-nav-toggle" type="button" aria-expanded="false" aria-controls="site-menu" hidden>
          <span class="site-nav-toggle__icon" aria-hidden="true"><span></span><span></span><span></span></span>Menu
        </button>
        <ul class="site-menu" id="site-menu">
          <li><a href="{{ base_path }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li><a href="{{ domain }}{{ link.url }}"{% if page.url == link.url or page.url contains link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
    </nav>
  </div>
</div>
